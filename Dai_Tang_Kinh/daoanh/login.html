<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đạo Ảnh - Đăng nhập Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        
        :root {
            --primary: #d97706;
            --bg-page: #020617;
            --bg-card: #0f172a;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            background: var(--bg-card);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .logo {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: black;
        }
        
        .gmail-btn {
            background: white;
            color: #333;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 24px;
        }
        
        .gmail-btn:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
        }
        
        .gmail-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .email-input {
            background: rgba(0,0,0,0.4);
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            color: white;
            width: 100%;
            margin-top: 16px;
            outline: none;
            text-align: center;
        }
        
        .email-input:focus {
            border-color: var(--primary);
        }
        
        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        
        .success-msg {
            color: #10b981;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 16px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <i class="fa-solid fa-dharmachakra"></i>
        </div>
        
        <h1 class="text-xl font-bold mb-2">Đạo Ảnh Admin</h1>
        <p class="text-slate-400 text-sm mb-4">Đăng nhập để quản lý dữ liệu</p>
        
        <!-- Google Sign-In Button -->
        <button id="google-signin" class="gmail-btn" onclick="showEmailInput()">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.13-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.63l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.96 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.38 8.55 1 10.22 1 12s.38 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.96 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Đăng nhập với Google
        </button>
        
        <!-- Email Input (hidden initially) -->
        <div id="email-section" style="display:none">
            <input type="email" id="email-input" class="email-input" placeholder="Nhập địa chỉ Gmail của bạn" onkeyup="handleEnter(event)">
            <button class="gmail-btn" onclick="verifyEmail()">
                <i class="fa-solid fa-arrow-right"></i>
                Tiếp tục
            </button>
            <button class="text-slate-400 text-sm mt-4 underline" onclick="backToGoogle()">
                <i class="fa-solid fa-arrow-left mr-1"></i>Quay lại
            </button>
        </div>
        
        <div id="loading" class="loading-spinner"></div>
        <div id="error" class="error-msg"></div>
        <div id="success" class="success-msg"></div>
        
        <div class="mt-8 pt-8 border-t border-slate-800">
            <a href="/daoanh/" class="text-slate-400 text-sm hover:text-white">
                <i class="fa-solid fa-arrow-left mr-1"></i>Quay về trang chủ
            </a>
        </div>
    </div>
    
    <script>
        const API_BASE = '/daoanh/api';
        
        function showEmailInput() {
            document.getElementById('google-signin').style.display = 'none';
            document.getElementById('email-section').style.display = 'block';
            document.getElementById('email-input').focus();
        }
        
        function backToGoogle() {
            document.getElementById('google-signin').style.display = 'flex';
            document.getElementById('email-section').style.display = 'none';
            hideMessages();
        }
        
        function handleEnter(e) {
            if (e.key === 'Enter') {
                verifyEmail();
            }
        }
        
        function showError(msg) {
            document.getElementById('error').textContent = msg;
            document.getElementById('error').style.display = 'block';
            document.getElementById('success').style.display = 'none';
        }
        
        function showSuccess(msg) {
            document.getElementById('success').textContent = msg;
            document.getElementById('success').style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }
        
        function hideMessages() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('google-signin').disabled = true;
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('google-signin').disabled = false;
        }
        
        async function verifyEmail() {
            const email = document.getElementById('email-input').value.trim().toLowerCase();
            
            if (!email) {
                showError('Vui lòng nhập địa chỉ email');
                return;
            }
            
            if (!email.endsWith('@gmail.com') && !email.endsWith('@googlemail.com')) {
                showError('Vui lòng nhập địa chỉ Gmail hợp lệ');
                return;
            }
            
            showLoading();
            hideMessages();
            
            try {
                const res = await fetch(API_BASE + '/login/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showSuccess('Đăng nhập thành công! Đang chuyển...');
                    
                    // Save session
                    if (data.session_token) {
                        localStorage.setItem('admin_session', data.session_token);
                    }
                    
                    // Redirect to admin after 1s
                    setTimeout(() => {
                        window.location.href = '/daoanh/admin/';
                    }, 1000);
                } else {
                    hideLoading();
                    showError(data.message || 'Email không được phép đăng nhập');
                }
            } catch(e) {
                hideLoading();
                showError('Lỗi kết nối: ' + e.message);
            }
        }
        
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            const session = localStorage.getItem('admin_session');
            if (session) {
                try {
                    const res = await fetch(API_BASE + '/login/check', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_token: session })
                    });
                    const data = await res.json();
                    if (data.valid) {
                        window.location.href = '/daoanh/admin/';
                    }
                } catch(e) {
                    console.log('Session check failed');
                }
            }
        });
    </script>
</body>
</html>
