<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiến Độ Dịch Kinh — Đạo Ảnh Admin</title>
    <!--
      T50-merge-catalog-tab (2026-11-05): nội dung của trang này đã gộp vào
      admin/translation_progress.html (tab "T50 — Dịch Kinh" + tab "Catalog
      Đại Tạng Kinh"). File này chỉ còn redirect, giữ nguyên tab/hash cũ nếu có
      (ví dụ #catalog, #nexus) để link cũ vẫn mở đúng tab. Không xoá file để
      tránh vỡ link 404 từ bookmark/lịch sử; bản gốc đã backup tại
      docs/sessions/2026-11-05/t50-progress.html.bak.
    -->
    <meta http-equiv="refresh" content="0; url=translation_progress.html#t50">
    <script>
      (function () {
        // Giữ hash cũ (#catalog, #nexus, #t50...) nếu URL có; mặc định #t50
        // vì trang cũ mặc định mở Tab 1 "Tiến Độ T50".
        var hash = (location.hash || '').replace(/^#/, '').trim().toLowerCase();
        var search = location.search || '';
        var target = 'translation_progress.html';
        if (hash) {
          target += '#' + hash;
        } else {
          // Hỗ trợ cả dạng cũ ?tab=catalog nếu có nơi nào từng link kiểu đó.
          var m = search.match(/[?&]tab=([a-z0-9_-]+)/i);
          target += '#' + (m ? m[1].toLowerCase() : 't50');
        }
        location.replace(target);
      })();
    </script>
</head>
<body>
  <p style="font:14px/1.5 Inter,system-ui,sans-serif;color:#94a3b8;background:#020617;padding:24px">
    Trang này đã gộp vào
    <a href="translation_progress.html#t50" style="color:#d97706">translation_progress.html</a>.
    Nếu không tự chuyển trang, bấm vào liên kết trên.
  </p>
</body>
</html>
