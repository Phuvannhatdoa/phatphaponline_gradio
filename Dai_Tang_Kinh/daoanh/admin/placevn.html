// Session check: redirect to login if not authenticated
(function() {
  var session = localStorage.getItem('admin_session');
  if (!session) {
    window.location.href = '/daoanh/login.html';
    return;
  }
  fetch('/daoanh/api/login/check', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_token: session})
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (!data.valid) {
      localStorage.removeItem('admin_session');
      window.location.href = '/daoanh/login.html';
    }
  }).catch(function() {});
})();

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const ICON_SVGS = {
  'database': [24,24,['<ellipse cx="12" cy="5" rx="9" ry="3"/>','<path d="M3 5V19a9 3 0 0 0 18 0V5"/>','<path d="M3 12a9 3 0 0 0 18 0"/>']],
  'search': [24,24,['<circle cx="11" cy="11" r="8"/>','<path d="m21 21-4.35-4.35"/>']],
  'map-pin': [24,24,['<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>','<circle cx="12" cy="10" r="3"/>']],
  'loader-2': [24,24,['<path d="M21 12a9 9 0 1 1-6.219-8.56"/>']],
  'zap': [24,24,['<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>']],
  'save': [24,24,['<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>','<polyline points="17 21 17 13 7 13 7 21"/>','<polyline points="7 3 7 8 15 8"/>']],
  'languages': [24,24,['<path d="m5 8 6 6"/>','<path d="m4 14 6-6 2-3"/>','<path d="M2 5h12"/>','<path d="M7 2h1"/>','<path d="m22 22-5-10-5 10"/>','<path d="M14 18h6"/>']],

  'milestone': [24,24,['<path d="M18 6H5a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h13l4-3.5L18 6Z"/>','<path d="M12 13v8"/>','<path d="M12 3v3"/>']],
  'sparkles': [24,24,['<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>','<path d="M5 3v4"/>','<path d="M19 17v4"/>','<path d="M3 5h4"/>','<path d="M17 19h4"/>']],
  'globe': [24,24,['<circle cx="12" cy="12" r="10"/>','<path d="M2 12h20"/>','<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>']],
  'file-text': [24,24,['<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>','<path d="M14 2v4a2 2 0 0 0 2 2h4"/>','<path d="M10 9H8"/>','<path d="M16 13H8"/>','<path d="M16 17H8"/>']],
  'alert-circle': [24,24,['<circle cx="12" cy="12" r="10"/>','<line x1="12" y1="8" x2="12" y2="12"/>','<line x1="12" y1="16" x2="12.01" y2="16"/>']],
  'check-circle-2': [24,24,['<circle cx="12" cy="12" r="10"/>','<path d="m9 12 2 2 4-4"/>']],

const LucideIcon = ({ name, className, ...props }) => {
  const icon = ICON_SVGS[name];
  if (icon) {
    const [w, h, pathsArr] = icon;
    const paths = Array.isArray(pathsArr) ? pathsArr.join('') : (pathsArr || '');
    return <span dangerouslySetInnerHTML={{ __html: `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className || ''}">${paths}</svg>` }} />;
  }
  return <i className={className} {...props}></i>;
};

const highlightKeyword = (text, keyword) => {
  if (!text || !keyword) return text;
  const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  return text.replace(re, '<mark class="bg-yellow-500/30 text-yellow-200 px-0.5 rounded">$1</mark>');
};

const App = () => {
  const [baseUrl, setBaseUrl] = useState(window.location.hostname === 'localhost' ? '' : 'https://phatphaponline.org');
  const fetchCounter = useRef(0);
  let isMapReady = false;
  const mapRef = useRef(null);
  const markerRef = useRef(null);

  const [queue, setQueue] = useState([]);
  const [totalCount, setTotalCount] = useState(0);
  const [currentOffset, setCurrentOffset] = useState(0);
  const [loadingMore, setLoadingMore] = useState(false);
  const [sidebarTab, setSidebarTab] = useState('all');
  const [sidebarFilter, setSidebarFilter] = useState('');
  const [cateFilter, setCateFilter] = useState('admin_place');
  const [selectedId, setSelectedId] = useState(null);
  const [details, setDetails] = useState(null);
  const [initialLoading, setInitialLoading] = useState(true);
  const [itemLoading, setItemLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [translating, setTranslating] = useState(false);
  const [message, setMessage] = useState(null);
  const initialLoadDone = useRef(false);
  const [showRawTei, setShowRawTei] = useState(false);
  const [hanContextVi, setHanContextVi] = useState({ loading: false, text: null, error: null });
  const [showRawTranslation, setShowRawTranslation] = useState(false);

  const parseTranslationParts = (text) => {
    if (!text) return { description: '', cbetaCitations: [], modernRefs: [] };
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const cbetaCitations = [];
    const modernRefs = [];
    const description = [];
    let mode = 'desc';
    for (const line of lines) {
      // Skip empty lines after trim
      if (!line) continue;
      
      // Check if this line starts a CBETA citation (after removing bullet chars)
      const cleaned = line.replace(/^[•\-–\s]+/, '');
      if (/^\(CBETA\s/.test(cleaned)) {
        // Validate that it looks like a proper CBETA reference: contains _p followed by at least one digit
        if (/_p\d+/.test(cleaned)) {
          mode = 'cbeta';
          cbetaCitations.push(line); // keep original line with bullet for display
        }
        // else: skip malformed "(CBETA" without proper reference
      } else if (/^(https?:\/\/|baike|CHGIS|Tang\s|Minh\s)/i.test(line) || /(sách|website|nguồn|tài liệu|tham khảo)/i.test(line)) {
        mode = 'modern';
        modernRefs.push(line);
      } else if (mode === 'cbeta') {
        // Only continue in cbeta mode if this line looks like a CBETA citation
        const cleaned = line.replace(/^[•\-–\s]+/, '');
        if (/^\(CBETA\s/.test(cleaned) && /_p\d+/.test(cleaned)) {
          cbetaCitations.push(line);
        } else {
          // Reset to description mode for non-CBETA lines
          mode = 'desc';
          description.push(line);
        }
      } else if (mode === 'modern') {
        modernRefs.push(line);
      } else {
        description.push(line);
      }
    }
    return { description: description.join('\n'), cbetaCitations, modernRefs };
  };
  const [cbdbData, setCbdbData] = useState(null);
  const [cbdbViDraft, setCbdbViDraft] = useState('');
  const [wikiData, setWikiData] = useState(null);
  const [wikiLoading, setWikiLoading] = useState(false);
  const [showFullWiki, setShowFullWiki] = useState(false);
  const [allPlaces, setAllPlaces] = useState([]);
  const [allPlacesLoading, setAllPlacesLoading] = useState(false);
  const [allPlacesTotal, setAllPlacesTotal] = useState(0);
  const [allPlacesOffset, setAllPlacesOffset] = useState(0);
  const [allPlacesLoadingMore, setAllPlacesLoadingMore] = useState(false);
  const [cbetaUnits, setCbetaUnits] = useState({});
  const [cbetaUnitExpanded, setCbetaUnitExpanded] = useState({});
  const [cbetaTranslation, setCbetaTranslation] = useState({});  // { [citationId]: { loading, clean, raw, showRaw, error, polished, uncertainMappings } }
  const [cbetaTermChoices, setCbetaTermChoices] = useState({});   // { [citationId]: { [termOriginal]: 'accepted'|'rejected'|null } }
  const [cbetaShowRaw, setCbetaShowRaw] = useState({});
  const [cbetaHanInline, setCbetaHanInline] = useState({});       // {[id]: {loading, han_text, error, visible}}
  const [cbetaExplanation, setCbetaExplanation] = useState({});  // {[id]: {loading, expl, error}}  // { [citationId]: boolean }
  const [cbetaSegmentTranslations, setCbetaSegmentTranslations] = useState({});  // { [segmentId]: { loading, units: [{han, vi}], error } }
  const [summaryEdits, setSummaryEdits] = useState({});  // { [citationId]: string } — local edit buffer
  const [savingSummary, setSavingSummary] = useState({}); // { [citationId]: boolean }
  const [entityPassages, setEntityPassages] = useState(null);
  const [entityPassagesLoading, setEntityPassagesLoading] = useState(false);
  const [cbetaCatalogData, setCbetaCatalogData] = useState(null);
  const [cbetaCatalogLoading, setCbetaCatalogLoading] = useState(false);

  const [formData, setFormData] = useState({
    name_vi: '', gps_lat: '', gps_long: '', note_vi: '',
    district_vi: '', country_vi: '', source: 'admin', needs_review: 0
  });

  const adminMapping = {
    '中國': 'Trung Quốc', '中国': 'Trung Quốc', '阿富汗': 'Afghanistan',
    '省': 'Tỉnh ', '市': 'Thành phố ', '縣': 'Huyện ', '区': 'Quận ', '區': 'Quận ',
    '镇': 'Trấn ', '鎮': 'Trấn ', '村': 'Thôn ', '乡': 'Xã ', '鄉': 'Xã '
  };

  const hasChineseChars = (str) => /[\u4e00-\u9fa5]/.test(str || "");

  const ensureLongId = (id) => {
    if (!id) return '';
    if (id.startsWith('PL')) return id;
    const digits = String(id).replace(/[^0-9]/g, '');
    return digits ? 'PL' + digits.padStart(12, '0') : id;
  };

  // ─── ReviewView Component ──────────────────────────────────────────────
  const ReviewView = ({ baseUrl, safeFetch, ensureLongId, handleSelectPlace, selectedId, setMessage }) => {
    const [items, setItems] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    const [offset, setOffset] = React.useState(0);
    const [total, setTotal] = React.useState(0);
    const LIMIT = 100;

    const loadReview = React.useCallback(async (append = false) => {
      setLoading(true);
      const data = await safeFetch(`${baseUrl}/daoanh/api/admin/places_auto_names?limit=${LIMIT}&offset=${append ? offset : 0}`);
      if (data?.success) {
        setItems(prev => append ? [...prev, ...data.places] : data.places);
        setTotal(data.total);
        if (!append) setOffset(data.places.length);
        else setOffset(prev => prev + data.places.length);
      }
      setLoading(false);
    }, [baseUrl, safeFetch, offset]);

    React.useEffect(() => { loadReview(false); }, []);

    const handleConfirm = async (id) => {
      const item = items.find(i => ensureLongId(i.id) === ensureLongId(id));
      if (!item) return;
      const res = await safeFetch(`${baseUrl}/daoanh/api/admin/namevi-map-places/save`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          dila_id: id,
          name_vi: item.name_vi,
          name_zh: item.name_zh,
          vn_name_status: 'reviewed'
        })
      });
      if (res?.success) {
        setItems(prev => prev.filter(i => ensureLongId(i.id) !== ensureLongId(id)));
        setTotal(prev => prev - 1);
        setMessage({ type: 'success', text: `Đã xác nhận tên cho ${id}` });
      }
    };

    if (loading && items.length === 0) return <div className="p-10 text-center text-[10px] text-slate-600 italic font-bold">Đang tải...</div>;

    return (
      <div>
        <div className="p-3 border-b border-slate-800/30">
          <div className="text-[9px] text-slate-500 font-bold">TỰ ĐỘNG / CHỜ DUYỆT</div>
          <div className="text-xl font-black text-white">{total}</div>
        </div>
        {items.length === 0 ? (
          <div className="p-10 text-center text-[10px] text-slate-600 italic font-bold">Không có tên nào chờ duyệt.</div>
        ) : (
          <>
            {items.map(item => (
              <div key={ensureLongId(item.id)} className={'flex items-start gap-2 p-4 border-b border-slate-800/30 transition-all ' + (selectedId === ensureLongId(item.id) ? 'bg-blue-500/5 border-l-4 border-l-blue-500' : 'hover:bg-slate-800/30')}>
                <div className="flex-1 min-w-0 cursor-pointer" onClick={() => handleSelectPlace(item.id)}>
                  <div className="text-[9px] mono text-slate-600 mb-0.5 tracking-widest">{ensureLongId(item.id)}</div>
                  <div className="font-bold text-sm text-slate-200 truncate">{item.name_vi}</div>
                  <div className="text-slate-500 text-xs serif">{item.name_zh}</div>
                </div>
                <button onClick={() => handleConfirm(ensureLongId(item.id))}
                  className="shrink-0 px-3 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-[9px] font-black uppercase text-white transition-all mt-1">
                  Duyệt
                </button>
              </div>
            ))}
            {items.length < total && (
              <div className="p-4 text-center">
                <button onClick={() => loadReview(true)} disabled={loading}
                  className="px-6 py-3 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 rounded-xl text-[10px] font-black uppercase tracking-widest text-white transition-all">
                  {loading ? 'Đang tải...' : `Tải thêm (${items.length}/${total})`}
                </button>
              </div>
            )}
          </>
        )}
      </div>
    );
  };

  const safeFetch = async (url, options = {}) => {
    const { timeout = 20000, ...fetchOptions } = options;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
      const response = await fetch(url, { ...fetchOptions, signal: controller.signal });
      if (!response.ok) throw new Error('HTTP Error: ' + response.status);
      return await response.json();
    } catch (err) {
      if (err.name === 'AbortError') {
        setMessage({ type: 'error', text: 'Máy chủ phản hồi chậm (Timeout)!' });
      } else if (err instanceof TypeError) {
        setMessage({ type: 'error', text: 'Lỗi CORS hoặc VPS bị chặn!' });
      } else {
        setMessage({ type: 'error', text: err.message });
      }
      return null;
    } finally {
      clearTimeout(timeoutId);
    }
  };

  const titleCaseVi = (str) => {
    if (!str) return '';
    return str.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  };

  function stripRefTags(s) {
    return s.replace(/<ns0:ref[^>]*>([^<]*)<\/ns0:ref>/g, '$1').replace(/<[^>]+>/g, '');
  }

  function extractHanContextFromTei(rawTei) {
    if (!rawTei) return null;
    const noteMatch = rawTei.match(/<ns0:note[^>]*>([\s\S]*?)<\/ns0:note>/);
    const biblMatches = [...rawTei.matchAll(/<ns0:bibl>([\s\S]*?)<\/ns0:bibl>/g)];
    const parts = [];
    if (noteMatch) parts.push(stripRefTags(noteMatch[1].trim()));
    if (biblMatches.length) parts.push(biblMatches.map(m => stripRefTags(m[1].trim())).join('\n'));
    return parts.join('\n\n') || null;
  }

  function parseTeiFields(rawTei, details) {
    if (!rawTei) return [];
    const fields = [];
    const locMatch = rawTei.match(/<ns0:location>([\s\S]*?)<\/ns0:location>/);
    // 1. Tên Hán chính
    const mainRe = /<ns0:placeName\s+xml:lang="zho-Hant"\s*>([^<]+)<\/ns0:placeName>/;
    const mainMatch = rawTei.match(mainRe);
    if (mainMatch) fields.push({ label: 'Tên Hán chính', value: mainMatch[1].trim() });
    else if (details?.name_zh) fields.push({ label: 'Tên Hán chính', value: details.name_zh });
    // 2. Tên Hán khác / Biến thể Hán
    const altRe = /<ns0:placeName[^>]*type="alternative"[^>]*xml:lang="zho-Hant"[^>]*>([^<]+)<\/ns0:placeName>/g;
    const altMatches = [...rawTei.matchAll(altRe)];
    if (altMatches.length) fields.push({ label: 'Tên Hán khác / Biến thể Hán', value: altMatches.map(m => m[1].trim()).join(', ') });
    // 3. Đơn vị hành chính (huyện)
    if (locMatch) {
      const countyRe = /<ns0:place[^>]*>([^<]+)<\/ns0:place>/;
      const countyMatch = locMatch[1].match(countyRe);
      if (countyMatch) fields.push({ label: 'Đơn vị hành chính (huyện)', value: countyMatch[1].trim() });
    }
    // 4. Tọa độ (lat, long)
    if (locMatch) {
      const geoRe = /<ns0:geo[^>]*>([^<]+)<\/ns0:geo>/;
      const geoMatch = locMatch[1].match(geoRe);
      if (geoMatch) {
        const coords = geoMatch[1].trim().split(/\s+/);
        fields.push({ label: 'Tọa độ (lat, long)', value: coords.length >= 2 ? coords[1] + ', ' + coords[0] : geoMatch[1].trim() });
      } else if (details?.gps_lat && details?.gps_long) {
        fields.push({ label: 'Tọa độ (lat, long)', value: details.gps_lat + ', ' + details.gps_long });
      }
    }
    // 5. Địa chỉ hành chính (TQ)
    const distRe = /<ns0:district>([^<]+)<\/ns0:district>/;
    const distMatch = rawTei.match(distRe);
    if (distMatch) fields.push({ label: 'Địa chỉ hành chính (TQ)', value: distMatch[1].trim() });
    else if (details?.district) fields.push({ label: 'Địa chỉ hành chính (TQ)', value: details.district });
    // 6. Ghi chú gốc (Hán) + 7. Phân loại DILA
    const notes = [...rawTei.matchAll(/<ns0:note[^>]*>([\s\S]*?)<\/ns0:note>/g)];
    for (const m of notes) {
      const isCat = m[0].includes('type="category"');
      const text = stripRefTags(m[1].trim());
      if (text) {
        if (isCat) fields.push({ label: 'Phân loại DILA', value: text });
        else fields.push({ label: 'Ghi chú gốc (Hán)', value: text });
      }
    }
    return fields;
  }

  const getTransliteration = async (text) => {
    if (!text) return '';
    const data = await safeFetch(baseUrl + '/daoanh/api/public/transliterate?text=' + encodeURIComponent(text));
    if (data?.success) return data.result;
    let result = text;
    Object.keys(adminMapping).forEach(key => { result = result.split(key).join(adminMapping[key]); });
    return result;
  };

  const initData = async () => {
    const data = await safeFetch(baseUrl + '/daoanh/api/admin/places_pending?limit=100&offset=0&cate=' + encodeURIComponent(cateFilter));
    if (data?.success) {
      setQueue(data.places || []);
      setTotalCount(data.total || 0);
      setCurrentOffset(data.places?.length || 0);
    }
    setInitialLoading(false);
    // Check for ?id= query param to auto-load a specific place
    const params = new URLSearchParams(window.location.search);
    const idParam = params.get('id');
    if (idParam && data?.places?.length > 0) {
      handleSelectPlace(ensureLongId(idParam), true);

  // Server-side search: debounce 300ms, dùng endpoint chuyên dụng (theo cate)

      } else if (sidebarFilter === '') {
        const data = await safeFetch(baseUrl + '/daoanh/api/admin/places_pending?limit=100&offset=0&cate=' + encodeURIComponent(cateFilter));
        if (data?.success) {
          setQueue(data.places || []);
          setTotalCount(data.total || 0);
          setCurrentOffset(data.places?.length || 0);

    }, 300);
    return () => clearTimeout(timer);

  // Fetch CBDB data when place changes
  useEffect(() => {

  const handleSelectPlace = async (id, isFirst = false) => {
    const currentCounter = ++fetchCounter.current;
    const fullId = ensureLongId(id);
    setSelectedId(fullId);
    setDetails(null);

    const queueItem = queue.find(q => ensureLongId(q.id) === fullId);
    setFormData({ name_vi: queueItem?.name_vi || '', district_vi: '', country_vi: '', gps_lat: '', gps_long: '', note_vi: '', source: 'admin', needs_review: 0 });

    if (!isFirst) setItemLoading(true);

    const data = await safeFetch(baseUrl + '/daoanh/api/admin/ai_judge/' + fullId, { timeout: 30000 });

    if (currentCounter !== fetchCounter.current) return;

    if (data?.success) {
      setDetails(data);

      let finalNameVi = data.lexicon_suggestions?.default_suggestion || data.name_vi_display || data.saved_name || queueItem?.name_vi || data.auto_name || '';
      if (!finalNameVi && data.name_zh) {
        finalNameVi = titleCaseVi(await getTransliteration(data.name_zh));
      }
      if (finalNameVi) finalNameVi = titleCaseVi(finalNameVi);

      // Han variants → extra transliteration suggestions
      if (data.han_variants?.length) {
        const extra = [];
        for (const v of data.han_variants) {
          if (v.type === 'alternative' && v.text) {
            const vi = titleCaseVi(await getTransliteration(v.text));
            if (vi) extra.push({ source: 'han_variant', han: v.text, text: vi });
          }
        }
        if (extra.length) {
          data.lexicon_suggestions = data.lexicon_suggestions || { default_suggestion: '', candidates: [] };
          data.lexicon_suggestions.candidates = [...data.lexicon_suggestions.candidates, ...extra];
          setDetails({ ...data });
        }
      }

      // Name variants → enrich with Vietnamese transliteration
      if (data.name_variants?.length) {
        let changed = false;
        for (const v of data.name_variants) {
          if (v.lang === 'zho-Hant' && v.name && !v.vi) {
            v.vi = titleCaseVi(await getTransliteration(v.name));
            if (v.vi) changed = true;
          }
        }
        if (changed) setDetails({ ...data });
      }

      // Extract + translate historical context
      const hanSrc = extractHanContextFromTei(data.raw_tei);
      if (hanSrc) {
        setHanContextVi({ loading: true, text: null });
        safeFetch(baseUrl + '/daoanh/api/admin/translate_context', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source_lang: 'zho-Hant', target_lang: 'vi', style: 'formal', text: hanSrc })
        }).then(res => {
          if (!res) { setHanContextVi({ loading: false, text: null, error: 'http_error' }); return; }
          if (res?.success && res.text_vi) {
            setHanContextVi({ loading: false, text: res.text_vi, error: null });
          } else {
            setHanContextVi({ loading: false, text: null, error: res?.error || 'translate_failed' });
          }
        });
      }

      // District/country: always from DILA RAW, ignore saved namevi_map_places
      let districtVi = '';
      let countryVi = '';
      const rawLoc = data.raw_district || data.district || data.address || '';
      const rawCountry = data.raw_country || data.country || '';
      if (rawLoc || rawCountry) {
        const parsed = await processTransResult(rawLoc, rawCountry);
        districtVi = parsed.districtVi || '';
        countryVi = parsed.countryVi || '';
      }
      // Combine for Ô 2 display, keep country separate for Ô 3
      const combinedAddr = districtVi && countryVi ? districtVi + ', ' + countryVi : (districtVi || countryVi || '');

      if (currentCounter !== fetchCounter.current) return;
        setFormData({
          name_vi: finalNameVi,
          gps_lat: data.gps_lat || data.geo_lat || '',
          gps_long: data.gps_long || data.geo_long || '',
          note_vi: data.note_vi || data.saved_note || '',
          district_vi: titleCaseVi(combinedAddr),
          country_vi: titleCaseVi(countryVi),
          source: data.source || 'admin',
          needs_review: data.needs_review || 0
        });
    }
    setItemLoading(false);
  };

  const processTransResult = async (rawText, countryHint = '') => {
    // No HVDic for district/country: use backend rule-based parse or adminMapping directly
    if (!rawText && !countryHint) return { countryVi: '', districtVi: '', formatted: '' };
    let countryVi = '';
    let districtVi = '';
    // Try backend /parse_district (rule-based, no HVDic)
    if (rawText) {
      const data = await safeFetch(baseUrl + '/daoanh/api/admin/parse_district', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({district: rawText, country: countryHint})
      });
      if (data?.success) {
        countryVi = data.country_vi || '';
        districtVi = data.district_vi || '';
      }
    }
    // Fallback: adminMapping dict directly (no HVDic)
    if (!countryVi && !districtVi) {
      let clean = rawText || countryHint || '';
      Object.keys(adminMapping).forEach(k => { if (clean.includes(k)) clean = clean.replace(k, adminMapping[k]); });
      if (clean.includes('-')) {
        const parts = clean.split('-').map(p => p.trim());
        countryVi = parts[0] || '';
        if (countryVi === '阿富汗') countryVi = 'Afghanistan';
        if (countryVi === '中國' || countryVi === '中国') countryVi = 'Trung Quốc';
        if (countryVi === '印度') countryVi = 'Ấn Độ';
        districtVi = parts.slice(1).reverse().join(' - ');
      } else {
        districtVi = clean;
        countryVi = countryHint || '';
        if (countryVi === '阿富汗' || countryVi === 'افغانستان') countryVi = 'Afghanistan';
        if (countryVi === '中國' || countryVi === '中国') countryVi = 'Trung Quốc';
        if (countryVi === '印度') countryVi = 'Ấn Độ';
      }
    }
    const formatted = districtVi && countryVi ? districtVi + ', ' + countryVi : (districtVi || countryVi || '');
    return { countryVi, districtVi, formatted };
  };

  const handleQuickTransliterate = async () => {
    if (!details) return;
    const currentCounter = ++fetchCounter.current;
    setTranslating(true);
    const nameVi = await getTransliteration(details.name_zh);
    if (currentCounter !== fetchCounter.current) { setTranslating(false); return; }
    const rawLoc = details.raw_district || details.district || details.address || '';
    const { countryVi, districtVi, formatted } = await processTransResult(rawLoc);
    if (currentCounter !== fetchCounter.current) { setTranslating(false); return; }
    setFormData(prev => ({ ...prev, name_vi: nameVi, country_vi: countryVi, district_vi: formatted || districtVi }));
    // Auto-save generated name so it becomes searchable immediately
    safeFetch(baseUrl + '/daoanh/api/admin/auto_save_name', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({dila_id: selectedId, name_vi: nameVi, name_zh: details.name_zh})
    });
    setTranslating(false);
    setMessage({ type: 'success', text: 'Kiện toàn địa giới từ SQLite!' });
    setTimeout(() => setMessage(null), 3000);
  };

  const handleAutoTranslate = async () => {

    const currentCounter = ++fetchCounter.current;
    setTranslating(true);
    const data = await safeFetch(baseUrl + '/daoanh/api/admin/translate_location', {

    if (data?.success) {

      setFormData(prev => ({ ...prev, district_vi: combined, country_vi: data.translated_country || '' }));
      setMessage({ type: 'success', text: 'AI Gemini đã kiện toàn Chánh ngữ!' });
    }
    setTranslating(false);
    setTimeout(() => setMessage(null), 3000);

  const handleSave = async () => {
    if (!details) return;
    const currentCounter = ++fetchCounter.current;
    setSaving(true);
    // Split Ô 2 (combined address) back into district_vi + country_vi for DB
    let saveDistrict = formData.district_vi || '';
    let saveCountry = formData.country_vi || '';
    if (!saveCountry && saveDistrict) {
      const lastComma = saveDistrict.lastIndexOf(', ');
      if (lastComma >= 0) {
        saveCountry = saveDistrict.substring(lastComma + 2).trim();
        saveDistrict = saveDistrict.substring(0, lastComma).trim();
      }
    }
    const saveBody = {
      ...formData,
      district_vi: saveDistrict,
      country_vi: saveCountry,
      dila_id: selectedId,
      name_zh: details?.name_zh
    };
    const data = await safeFetch(baseUrl + '/daoanh/api/admin/namevi-map-places/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(saveBody)

    if (currentCounter !== fetchCounter.current) { setSaving(false); return; }

      setQueue(prev => prev.filter(q => ensureLongId(q.id) !== selectedId));
      const currentIdx = filteredQueue.findIndex(q => ensureLongId(q.id) === selectedId);
      if (currentIdx >= 0 && currentIdx < filteredQueue.length - 1) {
        setTimeout(() => handleSelectPlace(filteredQueue[currentIdx + 1].id), 500);
      } else {
        setDetails(null);
        setSelectedId(null);
        setFormData({ name_vi: '', gps_lat: '', gps_long: '', note_vi: '', district_vi: '', country_vi: '', source: 'admin', needs_review: 0 });
      }
    } else {
      setMessage({ type: 'error', text: data?.error || 'Lưu thất bại!' });
    }
    setSaving(false);
    setTimeout(() => setMessage(null), 3000);

  const normalizeText = (s) => {
    if (!s) return '';
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase().trim();
  };

  const filteredQueue = useMemo(() => {
    const q = (sidebarFilter || '').trim();
    if (!q && sidebarTab !== 'untranslated') return queue;
    let result = queue;
    if (q) {
      const qNorm = normalizeText(q);
      result = result.filter(item => {
        const fid = ensureLongId(item.id);
        const viNorm = normalizeText(item.name_vi);
        return fid.toLowerCase().includes(q.toLowerCase()) ||
               item.name_zh.includes(q) ||
               (item.name_vi && item.name_vi.toLowerCase().includes(q.toLowerCase())) ||
               (viNorm && qNorm && viNorm.includes(qNorm));
      });
    }
    if (sidebarTab === 'untranslated') {
      result = result.filter(item => !item.name_vi || hasChineseChars(item.name_vi));

  const sqliteInfo = useMemo(() => {
    if (!details) return { rawD: '...', pendA: '...', country: '...', isHall: false, rawCountry: '...', geo: '...' };
    const rawD = details.raw_district || details.district || '';
    const rawCountry = details.raw_country || details.country || '';
    const pendA = details.pending_address || details.address || '';
    let country = rawCountry;
    if (country.includes('中國') || country.includes('中国')) country = 'Trung Quốc';
    if (!country && rawD.includes('-')) country = rawD.split('-')[0].trim();
    if (country.includes('中國') || country.includes('中国')) country = 'Trung Quốc';
    const isHall = (country === 'Vietnam' || pendA.includes('Vietnam')) && rawD !== '' && !rawD.includes('越南') && !rawD.includes('Vietnam');
    const geo = [details.gps_lat, details.gps_long].filter(Boolean).join(' ') || '';
    return { rawD, rawCountry, pendA, country, isHall, geo };
  }, [details]);

  const knowledgeData = useMemo(() => {
    if (!details) return { bibls: [], variants: [], xmlNote: "", cbetaIds: [] };

    let bibls = details.bibls || [];
    if (typeof details.listbibl === 'string' && details.listbibl) {
      bibls = details.listbibl.split(/[;\n]/).map(s => s.trim()).filter(Boolean);
    } else if (Array.isArray(details.listbibl)) {
      bibls = details.listbibl;
    }

    let variants = details.variants || [];
    variants = variants.map(v => {
      if (typeof v === 'string' && v.includes(':')) {
        const [lang, ...nameParts] = v.split(':');
        return { lang, name: nameParts.join(':') };
      }
      return { lang: 'unknown', name: String(v) };
    });
    if (Array.isArray(details.name_variants)) {
      details.name_variants.forEach(v => variants.push({ lang: v.lang, name: v.name, type: v.type || 'main', vi: v.vi }));
    }
    const seen = new Map();
    variants.forEach(v => { const k = `${v.lang}:${v.name}`; if (!seen.has(k) && v.name !== details.name_zh) seen.set(k, v); });
    variants = Array.from(seen.values());

    const xmlNote = details.xml_note || details.note || details.location_xml || details.note_vi_original || "";

    const cbetaIds = [];
    const cbetaRe = /CBETA\s+([A-Z]\d+n\d+_\w+)/g;
    for (const b of bibls) {
      const m = cbetaRe.exec(b);
      if (m) cbetaIds.push({ id: m[1], raw: b });
    }
    return { bibls, variants, xmlNote, cbetaIds };
  }, [details]);

  // Handle loading a CBETA unit on demand

      setCbetaUnits(prev => ({...prev, [id]: { loading: false, unit: null, summary: null, error: unitData?.message || 'no_local' }}));
      return;
    }
    setCbetaUnits(prev => ({...prev, [id]: { loading: false, unit: unitData, summary: null, error: null }}));
    // Auto-fetch LLM summary after unit loaded
    const sumData = await safeFetch(baseUrl + '/daoanh/api/admin/llm/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ han_text: unitData.han_text, place_name: placeName }),
      timeout: 60000
    });
    setCbetaUnits(prev => ({...prev, [id]: {
      ...prev[id],
      unit: unitData,
      summary: sumData || { summary_vi: '', provider: 'none' }
    }}));

    const res = await safeFetch(baseUrl + '/daoanh/api/admin/wiki/fetch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ place_id: selectedId, name_vi: details.name_vi, name_zh: details.name_zh }),
      timeout: 30000
    });
    if (res) {
      setWikiData({ ...res, cached_at: res.cached_at || new Date().toISOString() });
    } else {
      setWikiData({ error: 'fetch_failed', has_wiki: false });
    }
    setWikiLoading(false);
  };

  const toggleCbetaHan = async (id, query) => {
    const cur = cbetaHanInline[id];
    if (cur?.han_text || cur?.context_results) { setCbetaHanInline(prev => ({...prev, [id]: {...prev[id], visible: !prev[id]?.visible}})); return; }
    if (cur?.loading) return;
    const work = id.replace(/_.*$/, '');
    if (query) {
      setCbetaHanInline(prev => ({...prev, [id]: {loading: true, han_text: null, context_results: null, error: null, visible: true}}));
      const res = await safeFetch(baseUrl + '/daoanh/api/admin/cbeta/context?work=' + encodeURIComponent(work) + '&query=' + encodeURIComponent(query));
      if (res?.results) {
        setCbetaHanInline(prev => ({...prev, [id]: {loading: false, context_results: res.results, matches_found: res.matches_found, work: res.sigla, query: res.query, error: null, visible: true}}));
      } else {
        setCbetaHanInline(prev => ({...prev, [id]: {loading: false, han_text: null, context_results: null, error: res?.error || 'no_text', visible: true}}));
      }
    } else {
      setCbetaHanInline(prev => ({...prev, [id]: {loading: true, han_text: null, context_results: null, error: null, visible: true}}));
      const res = await safeFetch(baseUrl + '/daoanh/api/admin/cbeta/resolve?ref=' + encodeURIComponent(id));
      if (res?.han_text) {
        setCbetaHanInline(prev => ({...prev, [id]: {loading: false, han_text: res.han_text, error: null, visible: true}}));
      } else {
        setCbetaHanInline(prev => ({...prev, [id]: {loading: false, han_text: null, error: res?.message || 'no_text', visible: true}}));
      }
    }

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ han_text: hanText, segment_id: segmentId })
    });

      setCbetaSegmentTranslations(prev => ({...prev, [segmentId]: { loading: false, units: res.units, error: null }}));

      setCbetaSegmentTranslations(prev => ({...prev, [segmentId]: { loading: false, units: null, error: res?.error || 'translate_failed' }}));

  const handleTranslateRef = async (id, placeName) => {
    if (cbetaUnits[id]?.summary?.summary_vi) return;
    setCbetaUnits(prev => ({...prev, [id]: { ...prev[id], summary: null }}));
    let unitData = cbetaUnits[id]?.unit;
    if (!unitData) {
      setCbetaUnits(prev => ({...prev, [id]: { loading: false, unit: null, summary: null, error: null }}));
      const res = await safeFetch(baseUrl + '/daoanh/api/admin/cbeta/unit?id=' + encodeURIComponent(id));
      if (!res || res.has_local === false) {
        setCbetaUnits(prev => ({...prev, [id]: { ...prev[id], summary: { summary_vi: '', provider: 'none' }, error: 'no_local' }}));
        return;
      }
      unitData = res;
    }
    const sumData = await safeFetch(baseUrl + '/daoanh/api/admin/llm/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ han_text: unitData.han_text, place_name: placeName })
    });
    setCbetaUnits(prev => ({...prev, [id]: {
      ...prev[id],
      unit: unitData,
      summary: sumData || { summary_vi: '', provider: 'none' }
    }}));
  };

  // Shared Gemini translate (reused from BỐI CẢNH block)
  const translateWithGemini = async (citationId, rawBibl) => {
    if (!citationId) return;
    setCbetaTranslation(prev => ({...prev, [citationId]: { loading: true, clean: null, raw: null, error: null }}));
    const body = { ref: citationId };
    // Pass raw bibl as context if available
    if (rawBibl) body.raw = rawBibl;
    const res = await safeFetch(baseUrl + '/daoanh/api/admin/translate_gemini_cbeta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      timeout: 60000
    });
    if (res?.ok || res?.success) {
      const clean = res.vi_summary_clean || '';
      const raw = res.vi_summary_raw || '';
      const polished = res.polished?.polishedText || null;
      const uncertainMappings = res.polished?.uncertainMappings || [];
      if (clean || raw) {
        setCbetaTranslation(prev => ({...prev, [citationId]: { loading: false, clean, raw, showRaw: false, error: null, polished, uncertainMappings }}));
        return;
      }
    }
    setCbetaTranslation(prev => ({...prev, [citationId]: { loading: false, clean: null, raw: null, error: res?.error || res?.message || 'translate_failed' }}));
  };

  const handleSaveSummary = async (citationId) => {
    const text = summaryEdits[citationId];
    if (!text) return;
    setSavingSummary(prev => ({...prev, [citationId]: true}));
    const res = await safeFetch(baseUrl + '/daoanh/api/admin/cbeta/update_summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: citationId, vi_summary_clean: text })
    });
    if (res?.ok || res?.success) {
      // Update translation cache so UI refreshes
      setCbetaTranslation(prev => ({
        ...prev,
        [citationId]: {...prev[citationId], clean: text, polished: null}
      }));
      setSummaryEdits(prev => ({...prev, [citationId]: undefined}));
    }

  };

      body: JSON.stringify({ref: citationId, place_han: placeHan}),
      timeout: 60000
    });
    if (res?.ok && res?.explanation_vi) {
      setCbetaExplanation(prev => ({...prev, [citationId]: {loading: false, expl: res.explanation_vi, han: res.han_sentence || '', error: null}}));
    } else {

    }
  };

            {[['🏛️','Địa danh hành chính','admin_place'],['⛩️','Đạo tràng / Chùa','temple_site'],['🏯','Triều đại / Vùng rộng','dynasty_region'],['⛰️','Núi / Sơn','mountain'],['🌊','Sông / Thủy vực','river_lake'],['🏝️','Đảo / Biển / Khác','other']].map(([icon, label, slug]) => (

                                        {savingSummary[id] ? <><LucideIcon name="loader-2" className="w-3 h-3 animate-spin" /> Đang lưu</> : <><LucideIcon name="save" className="w-3 h-3" /> Lưu</>}
                                      </button>
                                      <span className="text-[8px] text-slate-600">Sẽ ghi đè vào DB, không cần dịch lại.</span>
                                    </div>
                                  </div>
                                ) : (
                                  <>
                                    {/* Polished text (HTML with <mark> tags) */}
                                    {tr.polished ? (
                                      <div className="text-[12px] leading-relaxed text-slate-300"
                                        dangerouslySetInnerHTML={{__html: tr.polished}} />
                                    ) : (
                                      <div className="text-[12px] leading-relaxed text-slate-300">{tr.clean}</div>
                                    )}
                                  </>
                                )}

                                {/* Uncertain terms suggestions panel */}
                                {tr.uncertainMappings?.length > 0 && (
                                  <div className="bg-amber-500/5 border border-amber-500/20 rounded-xl p-3 mt-1">
                                    <p className="text-[8px] text-amber-400/60 font-semibold uppercase tracking-wider mb-2">
                                      Các thuật ngữ chưa chắc chắn:
                                    </p>
                                    <div className="space-y-1">
                                      {tr.uncertainMappings.map((m, mi) => (
                                        <div key={mi} className="flex items-center gap-2 text-[11px]">
                                          <span className="text-slate-500 line-through">{m.original}</span>
                                          <LucideIcon name="arrow-right" className="w-3 h-3 text-amber-500/60" />
                                          <span className="text-slate-200">{m.normalized}</span>
                                          {m.han && m.han !== '???' && (
                                            <span className="text-[9px] text-slate-500">({m.han})</span>
                                          )}
                                          <span className={'text-[8px] px-1.5 py-0.5 rounded ' + (
                                            m.confidence >= 0.7 ? 'bg-amber-500/10 text-amber-400' : 'bg-rose-500/10 text-rose-400'
                                          )}>
                                            {Math.round(m.confidence * 100)}%
                                          </span>
                                          <button onClick={() => {
                                            const key = id + ':' + m.original;
                                            const isAccepted = cbetaTermChoices[key] === 'accepted';
                                            setCbetaTermChoices(prev => ({...prev, [key]: isAccepted ? 'rejected' : 'accepted'}));
                                          }} className={'ml-auto text-[9px] px-2 py-0.5 rounded font-semibold ' + (
                                            cbetaTermChoices[id + ':' + m.original] === 'accepted'
                                              ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                                              : 'bg-slate-800 text-slate-500 hover:text-slate-300 border border-slate-700'
                                          )}>
                                            {cbetaTermChoices[id + ':' + m.original] === 'accepted' ? '✓ Chấp nhận' : 'Chấp nhận'}
                                          </button>
                                        </div>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                {/* Lưu vào Ghi chú Việt ngữ button */}
                                {tr.polished && (
                                  <button onClick={() => {
                                    const cleaned = tr.polished
                                      .replace(/<mark[^>]*>([^<]+)<\/mark>/g, '$1')
                                      .replace(/<span[^>]*>([^<]+)<\/span>/g, '$1')
                                      .replace(/<[^>]+>/g, '')
                                      .replace(/\s+/g, ' ')
                                      .trim();
                                    setFormData(prev => ({...prev, note_vi: prev.note_vi
                                      ? prev.note_vi + '\n\n--- CBETA DỊCH VIỆT ---\n' + cleaned
                                      : cleaned}));
                                  }} className="mt-2 text-[9px] font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 hover:bg-amber-500/20 px-3 py-1.5 rounded-xl border border-amber-500/20 transition-all inline-flex items-center gap-1">
                                    <LucideIcon name="save" className="w-3 h-3" />
                                    Lưu vào Ghi chú Việt ngữ
                                  </button>
                                )}

                                <button onClick={() => toggleCbetaRaw(id)}
                                  className="text-[8px] text-slate-600 hover:text-slate-400 transition-colors font-semibold uppercase tracking-wider inline-flex items-center gap-1">
                                  <LucideIcon name={cbetaShowRaw[id] ? 'chevron-up' : 'chevron-down'} className="w-3 h-3" />
                                  {cbetaShowRaw[id] ? 'Ẩn bản dịch thô (LLM)' : 'Xem bản dịch thô (LLM)'}
                                </button>
                                {cbetaShowRaw[id] && tr?.raw && (
                                  <div className="bg-slate-900/50 border border-slate-700/50 rounded-xl p-3 mt-1">
                                    <p className="text-[8px] text-emerald-400/40 font-semibold uppercase tracking-wider mb-1">DỊCH TỰ ĐỘNG (GEMINI FREE) — tham khảo:</p>
                                    <pre className="text-[11px] leading-relaxed text-slate-400 whitespace-pre-wrap font-sans">{tr.raw}</pre>
                                  </div>
                                )}
                              </div>
                            )}
                            {tr?.error && (
                              <div className="mt-3 pt-3 border-t border-slate-800">
                                <p className="text-[9px] text-rose-400/60">{tr.error === 'no_text' ? 'Chưa có văn bản CBETA để dịch. Cần sync cbeta_ref_passages từ cbeta.db.' : `Không gọi được API dịch (${tr.error}).`}</p>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                  {knowledgeData.cbetaIds?.length > 0 && (
                    <div className="text-[9px] text-slate-600 leading-relaxed pt-3 border-t border-slate-800/30 mt-3">
                      Trích Dẫn Đại Tạng: bản dịch/tóm tắt tiếng Việt do LLM hỗ trợ, chỉ dùng tham khảo. Text chính thức cho GIS vẫn là bản dịch do editor nhập vào DB.
                    </div>
                  )}
                </div>
              </section>
              {/* End NGUỒN DẪN ĐẠI TẠNG KINH */}
            </div>
          </div>
        </div>
      </main>

      {/* TOAST */}
      {message && (<div className={'fixed bottom-12 right-12 p-6 rounded-3xl flex items-center gap-4 animate-in fade-in slide-in-from-right-12 z-[200] border backdrop-blur-xl ' + (message.type === 'success' ? 'bg-emerald-950/90 text-emerald-400 border-emerald-500/30 shadow-2xl' : 'bg-red-950/90 text-red-400 border-red-500/30 shadow-2xl') + ' font-sans font-bold shadow-2xl'}><LucideIcon name={message.type === 'error' ? 'alert-circle' : 'check-circle-2'} className="w-6 h-6" /><span className="font-black text-sm uppercase tracking-tight">{message.text}</span></div>)}

      {/* LOADING */}
      {initialLoading && (<div className="absolute inset-0 bg-[#0a0c10] backdrop-blur-3xl z-[300] flex items-center justify-center flex-col gap-10 font-sans font-bold text-center"><LucideIcon name="loader-2" className="w-20 h-20 text-amber-500 animate-spin opacity-40" /><div className="space-y-3"><div className="text-slate-100 font-black text-2xl tracking-[0.3em] uppercase italic">Kiện toàn Huệ Nhãn 13/05</div><div className="text-amber-500/50 text-[10px] font-black uppercase tracking-[0.2em] animate-pulse">Deepsearch SQLite VPS</div></div></div>)}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
