<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phật Tổ Đạo Ảnh - Ver 30 (Dark Theme Integration)</title>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700;800&family=Noto+Serif+Vietnamese:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
L.Icon.Default.mergeOptions({iconUrl:'/daoanh/static/leaflet/images/marker-icon.png',iconRetinaUrl:'/daoanh/static/leaflet/images/marker-icon-2x.png',shadowUrl:'/daoanh/static/leaflet/images/marker-shadow.png'});
</script>
<style>
  :root { --bg-dark: #0a0c10; --card-dark: #0f172a; --accent: #f59e0b; --text-main: #e2e8f0; --pp-gold: #f39c12; --pp-brown: #78350f; --pp-dark-bg: #0a0c10; --pp-card-bg: rgba(22, 28, 38, 0.8); --pp-text: #e2e8f0; }
  body { margin:0; padding:0; background: var(--pp-dark-bg); color: var(--pp-text); font-family: 'Inter', sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  ::selection { background: #f59e0b30; color: var(--accent); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.4s ease-out forwards; }
  .leaflet-container { background: #020617 !important; border-radius: 1.5rem; }
  .leaflet-tile-pane { filter: contrast(110%) brightness(95%); }
  .pp-card { background: var(--pp-card-bg); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: all 0.3s ease; }
  .pp-card:hover { border-color: rgba(243, 156, 18, 0.5); transform: translateY(-2px); }
  .halo-active { box-shadow: 0 0 0 4px rgba(243, 156, 18, 0.2), 0 0 35px 20px rgba(243, 156, 18, 0.3) !important; transform: scale(2.2); z-index: 1000 !important; }
  .lineage-chuc-thanh { background-color: var(--pp-gold) !important; border: 2px solid #fff !important; }
  .lineage-lieu-quan { background-color: #e74c3c !important; border: 2px solid #fff !important; }
  .lineage-lam-te { background-color: #3498db !important; border: 2px solid #fff !important; }
  .path-animation { stroke-dasharray: 12; animation: dash 15s linear infinite; stroke: var(--pp-gold); stroke-width: 3; filter: drop-shadow(0 0 8px rgba(243, 156, 18, 0.6)); }
  @keyframes dash { to { stroke-dashoffset: -500; } }
  .timeline-container { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(243, 156, 18, 0.2); box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
  input[type=range]::-webkit-slider-runnable-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
  .sidebar-scroll::-webkit-scrollbar { width: 4px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
</style>
</head>
<body class="overflow-hidden">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const Icon = ({ name, className, ...props }) => {
  return <i data-lucide={name} className={className} {...props}></i>;
};

const App = () => {
  const [baseUrl, setBaseUrl] = useState('https://phatphaponline.org');
  const [showConfig, setShowConfig] = useState(false);

  const fetchCounter = useRef(0);
  const mapContainerRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markerRef = useRef(null);

  const [queue, setQueue] = useState([]);
  const [sidebarTab, setSidebarTab] = useState('all');
  const [sidebarFilter, setSidebarFilter] = useState('');
  const [selectedId, setSelectedId] = useState(null);
  const [details, setDetails] = useState(null);
  const [initialLoading, setInitialLoading] = useState(true);
  const [connectionError, setConnectionError] = useState(null);
  const [leafletReady, setLeafletReady] = useState(false);
  const [itemLoading, setItemLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [translating, setTranslating] = useState(false);
  const [message, setMessage] = useState(null);
  const [timelineCentury, setTimelineCentury] = useState(17);
  const [lineageFilter, setLineageFilter] = useState(null);

  const [formData, setFormData] = useState({
    name_vi: '', gps_lat: '', gps_long: '', note_vi: '',
    district_vi: '', country_vi: '', source: 'admin', needs_review: 0
  });

  const adminMapping = {
    '中國': 'Trung Quốc', '中国': 'Trung Quốc', '阿富汗': 'Afghanistan',
    '省': 'Tỉnh ', '市': 'Thành phố ', '縣': 'Huyện ', '区': 'Quận ', '區': 'Quận ',
    '镇': 'Trấn ', '鎮': 'Trấn ', '村': 'Thôn ', '乡': 'Xã ', '鄉': 'Xã '
  };

  const hasChineseChars = (str) => /[\u4e00-\u9fa5]/.test(str || "");

  const ensureLongId = (id) => {
    if (!id) return '';
    const digits = String(id).replace(/[^0-9]/g, '');
    return digits ? 'PL' + digits.padStart(12, '0') : id;
  };

  const getTransliteration = async (text) => {
    if (!text) return '';
    try {
      const res = await fetch(baseUrl + '/daoanh/api/public/transliterate?text=' + encodeURIComponent(text));
      const data = await res.json();
      return data?.success ? data.result : text;
    } catch (e) {
      let result = text;
      Object.keys(adminMapping).forEach(key => { result = result.split(key).join(adminMapping[key]); });
      return result;
    }
  };

  const initData = async () => {
    setInitialLoading(true);
    setConnectionError(null);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);

    try {
      const res = await fetch(baseUrl + '/daoanh/api/admin/places_pending', {
        method: 'GET', mode: 'cors',
        signal: controller.signal,
        headers: { 'Accept': 'application/json' }
      });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error('HTTP ' + res.status + ': Khong co quyen truy cap (CORS) hoac Server loi.');
      const data = await res.json();
      if (data?.success) {
        setQueue(data.places || []);
        if (data.places?.length > 0) handleSelectPlace(data.places[0].id, true);
        setConnectionError(null);
      } else {
        throw new Error("Phan hoi tu VPS khong dung dinh dang success.");
      }
    } catch (err) {
      console.error("Fetch Error:", err);
      let errorMsg = "Loi ket noi VPS.";
      if (err.name === 'AbortError') errorMsg = "Het thoi gian ket noi (Timeout). VPS phan hoi qua cham.";
      else if (err.message.includes('Failed to fetch')) errorMsg = "Loi CORS hoac Network: Trinh duyet chan yeu cau tu Canvas toi VPS.";
      else errorMsg = err.message;
      setConnectionError(errorMsg);
    } finally {
      setInitialLoading(false);
    }
  };

  useEffect(() => {
    const checkL = setInterval(() => {
      if (window.L) { setLeafletReady(true); clearInterval(checkL); }
    }, 100);
    return () => clearInterval(checkL);
  }, []);

  useEffect(() => {
    if (leafletReady && !mapInstanceRef.current && mapContainerRef.current) {
      mapInstanceRef.current = window.L.map(mapContainerRef.current, {
        center: [16.0, 107.5], zoom: 5, zoomControl: false
      });
      window.L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
      }).addTo(mapInstanceRef.current);
      window.L.control.zoom({ position: 'bottomright' }).addTo(mapInstanceRef.current);
    }
    if (leafletReady) initData();
  }, [leafletReady]);

  useEffect(() => {
    if (!mapInstanceRef.current) return;
    if (markerRef.current) {
      if (mapInstanceRef.current.hasLayer(markerRef.current))
        mapInstanceRef.current.removeLayer(markerRef.current);
      markerRef.current = null;
    }
    if (leafletReady && details?.gps_lat && details?.gps_long) {
      const lat = parseFloat(details.gps_lat);
      const lng = parseFloat(details.gps_long);
      if (!isNaN(lat) && !isNaN(lng)) {
        const icon = window.L.divIcon({
          className: 'custom-div-icon',
          html: `<div class="w-4 h-4 rounded-full border-2 border-white shadow-[0_0_10px_rgba(255,255,255,0.5)] halo-active"></div>`,
          iconSize: [16, 16], iconAnchor: [8, 8]
        });
        markerRef.current = window.L.marker([lat, lng], { icon }).addTo(mapInstanceRef.current);
        mapInstanceRef.current.flyTo([lat, lng], 13, { duration: 1.5 });
      }
    }
  }, [details, leafletReady]);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  }, [details, message, selectedId, initialLoading, connectionError, timelineCentury]);

  const handleSelectPlace = async (id, isFirst = false) => {
    const currentCounter = ++fetchCounter.current;
    const fullId = ensureLongId(id);
    setSelectedId(fullId);
    setDetails(null);

    const queueItem = queue.find(q => ensureLongId(q.id) === fullId);
    if (queueItem) {
      setFormData(prev => ({ ...prev, name_vi: queueItem.name_vi || '' }));
    }

    if (!isFirst) setItemLoading(true);

    try {
      const res = await fetch(baseUrl + '/daoanh/api/admin/ai_judge/' + fullId, { mode: 'cors' });
      const data = await res.json();

      if (currentCounter !== fetchCounter.current) return;

      if (data?.success) {
        setDetails(data);
        let finalNameVi = data.saved_name || data.auto_name || queueItem?.name_vi || '';
        if (!finalNameVi && data.name_zh) {
          finalNameVi = await getTransliteration(data.name_zh);
        }
        setFormData({
          name_vi: finalNameVi,
          gps_lat: data.gps_lat || '',
          gps_long: data.gps_long || '',
          note_vi: data.note_vi || data.saved_note || '',
          district_vi: data.district_vi || '',
          country_vi: data.country_vi || '',
          source: data.source || 'admin',
          needs_review: data.needs_review || 0
        });
      }
    } catch (err) {
      console.error(err);
    } finally {
      setItemLoading(false);
    }
  };

  const handleAutoTranslate = async () => {
    if (!details) return;
    setTranslating(true);
    try {
      const res = await fetch(baseUrl + '/daoanh/api/admin/translate_location', {
        method: 'POST', mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: selectedId, district: details.raw_district || details.district || details.address, country: details.raw_country || details.country })
      });
      const data = await res.json();
      if (data?.success) {
        const nameVi = await getTransliteration(details.name_zh);
        setFormData(prev => ({ ...prev, name_vi: nameVi, district_vi: data.translated_district, country_vi: data.translated_country }));
        setMessage({ type: 'success', text: 'AI Gemini da boc tach Viet ngu!' });
      }
    } catch (err) {
      setMessage({ type: 'error', text: 'Loi boc tach AI.' });
    } finally {
      setTranslating(false);
      setTimeout(() => setMessage(null), 3000);
    }
  };

  const handleSave = async () => {
    setSaving(true);
    try {
      const res = await fetch(baseUrl + '/daoanh/api/admin/namevi-map-places/save', {
        method: 'POST', mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...formData, dila_id: selectedId, name_zh: details?.name_zh })
      });
      const data = await res.json();
      if (data?.success) setMessage({ type: 'success', text: 'Da luu Mapping vao SQLite!' });
    } catch (err) {
      setMessage({ type: 'error', text: 'Loi luu du lieu.' });
    } finally {
      setSaving(false);
      setTimeout(() => setMessage(null), 3000);
    }
  };

  const filteredQueue = useMemo(() => {
    return queue.filter(item => {
      const fid = ensureLongId(item.id);
      const matchSearch = fid.toLowerCase().includes(sidebarFilter.toLowerCase()) ||
                          item.name_zh.includes(sidebarFilter) ||
                          (item.name_vi && item.name_vi.toLowerCase().includes(sidebarFilter.toLowerCase()));
      if (sidebarTab === 'untranslated') return matchSearch && (!item.name_vi || hasChineseChars(item.name_vi));
      return matchSearch;
    });
  }, [queue, sidebarTab, sidebarFilter]);

  const lineageEmoji = (l) => {
    if (l === 'chuc-thanh') return '⛩️';
    if (l === 'lieu-quan') return '🏯';
    return '🕉️';
  };

  return (
    <div className="flex flex-col h-screen bg-[#0a0c10] text-slate-200 overflow-hidden">
      {/* TOP NAV BAR */}
      <nav className="h-[70px] bg-[#020617] border-b border-white/5 flex items-center justify-between px-8 z-[1001] relative shrink-0">
        <div className="flex items-center gap-4">
          <div className="w-11 h-11 bg-gradient-to-tr from-amber-600 to-amber-400 rounded-xl flex items-center justify-center text-white shadow-lg shadow-amber-900/20">
            <span className="text-2xl font-bold">&#58125;</span>
          </div>
          <div>
            <h1 className="text-lg font-black text-white tracking-tight uppercase">
              MOI MANH GHEP <span className="text-amber-500">TRO VE MOT NGUON</span>
            </h1>
            <p className="text-[8px] font-bold text-slate-500 uppercase tracking-[0.4em]">GIS Dao Anh Ver 30 &bull; Phatphaponline.org</p>
          </div>
        </div>

        <div className="hidden md:flex flex-1 max-w-xl mx-12 relative group">
          <input type="text" placeholder="Tim nhan vat, dia danh hoac giao ly..."
            value={sidebarFilter} onChange={e => setSidebarFilter(e.target.value)}
            className="w-full pl-12 pr-4 py-3 bg-white/5 border border-white/10 rounded-full focus:ring-2 focus:ring-amber-500 focus:bg-white/10 transition-all text-sm outline-none text-white placeholder:text-slate-600" />
          <div className="absolute left-4 top-3.5 text-slate-500 pointer-events-none">
            <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
        </div>

        <div className="flex items-center gap-6">
          <div className="hidden xl:flex flex-col items-end border-r pr-6 border-white/5">
            <span className="text-[9px] font-black text-slate-500 uppercase">SERVER STATUS</span>
            <span className="text-xs font-bold text-amber-500 flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(243,156,18,1)]"></span> VPS ACTIVE
            </span>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setShowConfig(!showConfig)} className="p-2 hover:bg-white/5 rounded-lg transition-colors">
              <Icon name="settings" className="w-5 h-5 text-slate-500" />
            </button>
            <div className="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center">
              <span className="text-[10px] font-bold text-slate-400">A</span>
            </div>
            <span className="text-[10px] font-bold text-slate-500 hidden sm:block">ADMIN_Z30</span>
          </div>
        </div>
      </nav>

      {/* SETTINGS PANEL */}
      {showConfig && (
        <div className="absolute top-[70px] right-8 w-80 z-[999] p-4 bg-slate-900/95 border border-amber-500/20 rounded-2xl space-y-3 shadow-2xl backdrop-blur-xl fade-in">
          <label className="text-[9px] font-black uppercase text-amber-500">VPS Endpoint (CORS Fix)</label>
          <input type="text" value={baseUrl} onChange={e => setBaseUrl(e.target.value)}
            className="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-[10px] text-amber-200 outline-none focus:border-amber-500" />
          <p className="text-[8px] text-slate-500 italic">Dam bao backend da bat Access-Control-Allow-Origin: *</p>
          <div className="flex gap-2">
            <button onClick={() => { setBaseUrl(baseUrl.includes('https') ? baseUrl.replace('https', 'http') : baseUrl.replace('http', 'https')); }}
              className="flex-1 px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-[9px] font-black uppercase text-slate-400">Doi HTTP/HTTPS</button>
            <button onClick={initData}
              className="flex-1 px-3 py-2 bg-amber-600 text-black rounded-xl text-[9px] font-black uppercase flex items-center justify-center gap-1">
              <Icon name="refresh-cw" className="w-3 h-3" /> Thu lai
            </button>
          </div>
        </div>
      )}

      <div className="flex flex-1 overflow-hidden">
        {/* SIDEBAR */}
        <aside className="w-[420px] bg-gradient-to-b from-[#0f172a] to-[#020617] border-r border-white/5 flex flex-col z-20 sidebar-scroll overflow-y-auto shrink-0">
          {/* Navigation Cards */}
          <div className="p-5 pb-3 space-y-4 border-b border-white/5">
            <div className="grid grid-cols-2 gap-3">
              <button onClick={() => setLineageFilter(lineageFilter === 'chuc-thanh' ? null : 'chuc-thanh')}
                className={'pp-card p-4 text-left group transition-all ' + (lineageFilter === 'chuc-thanh' ? 'border-amber-500/50 ring-1 ring-amber-500/20' : '')}>
                <div className="w-8 h-8 bg-amber-500/10 rounded-lg flex items-center justify-center mb-3 group-hover:bg-amber-500/20 transition-colors">
                  <span className="text-amber-500">&#x1F6E9;&#xFE0F;</span>
                </div>
                <h5 className="text-[10px] font-black text-white uppercase mb-1">Chuc Thanh</h5>
                <p className="text-[8px] text-slate-500">Mapping ID quoc te DILA</p>
              </button>
              <button onClick={() => setLineageFilter(lineageFilter === 'lieu-quan' ? null : 'lieu-quan')}
                className={'pp-card p-4 text-left group transition-all ' + (lineageFilter === 'lieu-quan' ? 'border-red-500/50 ring-1 ring-red-500/20' : '')}>
                <div className="w-8 h-8 bg-red-500/10 rounded-lg flex items-center justify-center mb-3 group-hover:bg-red-500/20 transition-colors">
                  <span className="text-red-500">&#x1F3EF;</span>
                </div>
                <h5 className="text-[10px] font-black text-white uppercase mb-1">Lieu Quan</h5>
                <p className="text-[8px] text-slate-500">He toa do tri thuc GIS</p>
              </button>
            </div>
            <div className="flex bg-slate-900/80 p-1 rounded-xl border border-white/5">
              <button onClick={() => setSidebarTab('all')} className={'flex-1 py-2 text-[10px] font-black uppercase rounded-lg transition-all ' + (sidebarTab === 'all' ? 'bg-slate-700 text-white shadow-lg' : 'text-slate-500')}>Hang doi</button>
              <button onClick={() => setSidebarTab('untranslated')} className={'flex-1 py-2 text-[10px] font-black uppercase rounded-lg transition-all ' + (sidebarTab === 'untranslated' ? 'bg-amber-600 text-white' : 'text-slate-500')}>Chua dich</button>
            </div>
          </div>

          {/* Queue List */}
          <div className="flex-1 overflow-y-auto custom-scrollbar">
            {filteredQueue.length === 0 ? (
              <div className="text-center py-20 px-10">
                <div className="w-24 h-24 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-8 shadow-inner">
                  <span className="text-5xl opacity-50">&#x1F549;&#xFE0F;</span>
                </div>
                <h3 className="text-xs font-bold text-amber-500 mb-2 uppercase tracking-[0.3em]">KHOI TAO TRUY VAN</h3>
                <p className="text-[11px] text-slate-500 leading-relaxed italic serif">&quot;Khop noi tri thuc - Truyen tai tam linh.&quot;<br />Chon mot nut du lieu tren ban do de bat dau.</p>
              </div>
            ) : (
              filteredQueue.map(item => (
                <button key={ensureLongId(item.id)} onClick={() => handleSelectPlace(item.id)}
                  className={'w-full p-5 text-left border-b border-white/5 transition-all ' + (selectedId === ensureLongId(item.id) ? 'bg-amber-500/10 border-l-4 border-l-amber-500' : 'hover:bg-white/5')}>
                  <div className="text-[9px] font-mono text-slate-600 mb-1 tracking-widest">{ensureLongId(item.id)}</div>
                  <div className="flex items-center justify-between gap-2">
                    <span className={'font-bold text-sm truncate ' + (item.name_vi && !hasChineseChars(item.name_vi) ? 'text-slate-200' : 'text-amber-500 italic')}>{item.name_vi || 'Chua dinh danh'}</span>
                    <span className="text-slate-600 text-lg serif italic opacity-60 shrink-0">{item.name_zh}</span>
                  </div>
                </button>
              ))
            )}
          </div>

          <div className="p-4 border-t border-white/5 text-center">
            <p className="text-[9px] text-slate-600 font-bold uppercase tracking-widest">Van hanh boi Phap Thi Hoi (Ver Demo)</p>
          </div>
        </aside>

        {/* MAIN: Map + Workspace */}
        <main className="flex-1 flex flex-col relative">
          {/* Header */}
          <header className="h-20 border-b border-white/5 bg-[#0f172a]/20 backdrop-blur-md flex items-center justify-between px-8 z-10 shrink-0">
            <div className="flex items-center gap-6">
              <div className="p-3 bg-amber-500/10 rounded-2xl border border-amber-500/20"><Icon name="map-pin" className="text-amber-500 w-6 h-6" /></div>
              <div>
                <div className="text-[10px] font-mono font-black text-slate-500 uppercase tracking-widest">{selectedId || 'NO_ID'}</div>
                <div className="text-xl font-black text-white flex items-center gap-3">
                  <span className="text-amber-500 serif">{details?.name_zh || '...'}</span>
                  {itemLoading && <Icon name="loader-2" className="w-4 h-4 animate-spin text-amber-500" />}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={handleAutoTranslate} disabled={translating}
                className="p-3 bg-blue-500/10 hover:bg-blue-500 text-blue-500 hover:text-white rounded-xl transition-all border border-blue-500/20 shadow-lg">
                <Icon name="sparkles" className={'w-5 h-5 ' + (translating ? 'animate-spin' : '')} />
              </button>
              <button onClick={handleSave} disabled={saving}
                className="px-8 py-3 bg-amber-600 hover:bg-amber-500 rounded-xl text-xs font-black uppercase tracking-widest text-black flex items-center gap-2 shadow-xl shadow-amber-900/20 disabled:opacity-50">
                {saving ? <Icon name="loader-2" className="w-4 h-4 animate-spin" /> : <Icon name="save" className="w-4 h-4" />} Luu Mapping
              </button>
            </div>
          </header>

          {/* Map */}
          <div className="flex-1 relative min-h-0">
            <div ref={mapContainerRef} id="map" className="w-full h-full z-1"></div>

            {/* Timeline */}
            <div className="absolute bottom-6 left-1/2 -translate-x-1/2 w-full max-w-2xl px-6 z-[1000]">
              <div className="timeline-container p-6 rounded-[2.5rem]">
                <div className="flex justify-between items-end mb-4">
                  <div>
                    <p className="text-[9px] font-black text-amber-500 uppercase tracking-widest mb-1 italic">Truc thoi gian su lieu GIS</p>
                    <h3 className="text-2xl font-black text-white italic tracking-tighter">The ky {timelineCentury}</h3>
                  </div>
                  <div className="text-right">
                    <span className="text-2xl font-black text-white/10">{filteredQueue.length}</span>
                    <p className="text-[8px] font-bold text-slate-600 uppercase">Entities</p>
                  </div>
                </div>
                <input type="range" min="1" max="21" value={timelineCentury}
                  onChange={e => setTimelineCentury(parseInt(e.target.value))}
                  className="w-full h-1.5 rounded-full appearance-none cursor-pointer accent-amber-500 outline-none" />
              </div>
            </div>
          </div>
        </main>
      </div>

      {/* TOAST */}
      {message && (
        <div className={'fixed bottom-12 right-12 p-6 rounded-3xl flex items-center gap-4 z-[200] border backdrop-blur-2xl shadow-2xl ' + (message.type === 'success' ? 'bg-emerald-950/90 text-emerald-400 border-emerald-500/30' : 'bg-red-950/90 text-red-400 border-red-500/30')}>
          <Icon name={message.type === 'error' ? 'alert-circle' : 'check-circle-2'} className="w-6 h-6" />
          <span className="font-black text-xs uppercase tracking-widest">{message.text}</span>
        </div>
      )}

      {/* INITIAL LOADING */}
      {initialLoading && !connectionError && (
        <div className="absolute inset-0 bg-[#0a0c10] z-[300] flex items-center justify-center flex-col gap-8">
          <Icon name="loader-2" className="w-16 h-16 text-amber-500 animate-spin opacity-40" />
          <div className="text-center">
            <div className="text-white font-black text-xl tracking-[0.4em] uppercase italic">DAO ANH SYSTEM</div>
            <div className="text-amber-500/50 text-[10px] font-black uppercase tracking-[0.2em] mt-2">Connecting SQLite VPS...</div>
          </div>
        </div>
      )}

      {/* CONNECTION ERROR */}
      {connectionError && (
        <div className="absolute inset-0 bg-[#0a0c10] z-[400] flex items-center justify-center p-6 text-center">
          <div className="max-w-md space-y-6">
            <div className="w-20 h-20 bg-red-500/10 rounded-3xl flex items-center justify-center mx-auto border border-red-500/20">
              <Icon name="alert-triangle" className="w-10 h-10 text-red-500" />
            </div>
            <div className="space-y-2">
              <h2 className="text-xl font-black text-white uppercase italic">Loi CORS / Ket noi</h2>
              <p className="text-slate-400 text-sm leading-relaxed">{connectionError}</p>
            </div>
            <div className="bg-slate-900/50 p-4 rounded-xl border border-white/5 text-left">
              <p className="text-[10px] font-bold text-slate-500 uppercase mb-2">Cach khac phuc nhanh:</p>
              <ul className="text-[10px] text-slate-400 space-y-1 list-disc pl-4">
                <li>Bat <strong>CORS</strong> tren VPS (Allow-Origin: *).</li>
                <li>Kiem tra xem VPS co dang chay <strong>HTTPS</strong> khong.</li>
                <li>Thu doi <code>https</code> thanh <code>http</code> trong phan Cai dat (neu local).</li>
              </ul>
            </div>
            <div className="flex gap-3">
              <button onClick={() => { setBaseUrl(baseUrl.includes('https') ? baseUrl.replace('https', 'http') : baseUrl.replace('http', 'https')); }}
                className="flex-1 px-4 py-3 bg-white/5 text-white border border-white/10 rounded-xl text-[10px] font-black uppercase tracking-widest">
                Doi HTTP/HTTPS
              </button>
              <button onClick={initData}
                className="flex-[2] px-8 py-3 bg-amber-600 text-black rounded-xl text-xs font-black uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg shadow-amber-600/20">
                <Icon name="refresh-cw" className="w-4 h-4" /> Thu lai
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
