<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đạo Ảnh - Địa danh thiếu thông tin</title>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0c10] text-slate-200 font-sans">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const App = () => {
  const [places, setPlaces] = useState([]);
  const [total, setTotal] = useState(0);
  const [limit] = useState(50);
  const [offset, setOffset] = useState(0);
  const [loading, setLoading] = useState(false);
  const [loadingMore, setLoadingMore] = useState(false);

  const fetchPlaces = async (newOffset, append = false) => {
    if (append) setLoadingMore(true); else setLoading(true);
    try {
      const res = await fetch(`/daoanh/api/admin/places_missing_info?limit=${limit}&offset=${newOffset}`);
      const data = await res.json();
      if (data.success) {
        if (append) setPlaces(prev => [...prev, ...data.places]);
        else setPlaces(data.places);
        setTotal(data.total);
        setOffset(newOffset + data.places.length);
      }
    } catch (e) {
      console.error('Fetch error:', e);
    } finally {
      setLoading(false); setLoadingMore(false);
    }
  };

  useEffect(() => { fetchPlaces(0, false); }, []);

  const colorBadge = (val) => {
    if (!val || val.trim() === '') return 'bg-red-500/20 text-red-400 border-red-500/30';
    return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
  };

  return (
    <div className="max-w-6xl mx-auto p-8">
      <div className="flex items-center gap-4 mb-8">
        <div className="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center font-black text-black">!</div>
        <div>
          <h1 className="text-2xl font-black uppercase tracking-tight">Địa danh thiếu thông tin</h1>
          <p className="text-slate-500 text-sm">Tổng số: <span className="text-amber-500 font-bold">{total}</span></p>
        </div>
      </div>

      {loading ? (
        <div className="text-center text-slate-600 py-20 text-sm font-bold animate-pulse">Nạp dữ liệu...</div>
      ) : places.length === 0 ? (
        <div className="text-center text-slate-600 py-20 text-sm font-bold uppercase tracking-widest">Không có địa danh thiếu thông tin.</div>
      ) : (
        <>
          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="text-[10px] font-black uppercase tracking-widest text-slate-500 border-b border-slate-800">
                  <th className="py-4 px-4">ID</th>
                  <th className="py-4 px-4">Tên Hán</th>
                  <th className="py-4 px-4">Tên Việt</th>
                  <th className="py-4 px-4">Quốc gia</th>
                  <th className="py-4 px-4">Huyện (Tỉnh - Quốc gia)</th>
                  <th className="py-4 px-4">Vị</th>
                  <th className="py-4 px-4">Hành động</th>
                </tr>
              </thead>
              <tbody>
                {places.map(place => (
                  <tr key={place.id} className="border-b border-slate-800/50 hover:bg-slate-800/20 transition-colors">
                    <td className="py-4 px-4 text-[11px] mono text-slate-500">{place.id}</td>
                    <td className="py-4 px-4 text-lg serif text-white">{place.name_zh || '—'}</td>
                    <td className={`py-4 px-4 text-sm ${place.name_vi ? 'text-slate-200' : 'text-slate-600 italic'}`}>{place.name_vi || 'Chưa có'}</td>
                    <td className="py-4 px-4">
                      <span className={`px-3 py-1 rounded-lg text-[10px] font-bold border ${colorBadge(place.country)}`}>
                        {place.country || 'THIẾU'}
                      </span>
                    </td>
                    <td className="py-4 px-4">
                      <span className={`px-3 py-1 rounded-lg text-[10px] font-bold border ${colorBadge(place.district_raw)}`}>
                        {place.district_raw || 'THIẾU'}
                      </span>
                    </td>
                    <td className="py-4 px-4 text-xs text-slate-500">{place.province || '—'}</td>
                    <td className="py-4 px-4">
                      <a href={`/daoanh/admin/placevn.html?id=${place.id}`}
                         className="px-3 py-1.5 rounded-lg text-[10px] font-bold border bg-blue-500/10 text-blue-400 border-blue-500/30 hover:bg-blue-500 hover:text-black transition-all inline-flex items-center gap-1.5">
                        ✎ Edit
                      </a>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="flex items-center justify-between mt-8">
            <span className="text-xs text-slate-600">Hiển thị {places.length}/{total}</span>
            {places.length < total && (
              <button onClick={() => fetchPlaces(offset, true)} disabled={loadingMore}
                className="px-8 py-3 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 rounded-xl text-xs font-black uppercase tracking-widest text-black transition-all flex items-center gap-2">
                {loadingMore ? <span className="animate-pulse">Nạp...</span> : 'Tải thêm'}
              </button>
            )}
          </div>
        </>
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
