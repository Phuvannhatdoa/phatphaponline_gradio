# Nginx configuration for Phật Tổ Đạo Ảnh
# Place in /etc/nginx/sites-available/daoanh
# (sites-available files are included inside nginx's http{} block, so
#  limit_req_zone must live here — outside server{} — NOT inside server{})

upstream daoanh_app {
    server 127.0.0.1:5000;
}

upstream daoanh_auth {
    server 127.0.0.1:5001;
}

# Rate-limit zones — MUST be outside server{} (http context)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name phatphaponline.org www.phatphaponline.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name phatphaponline.org www.phatphaponline.org;

    ssl_certificate     /etc/letsencrypt/live/phatphaponline.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phatphaponline.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;

    # ── Block sensitive files in /data/ ────────────────────────────────────
    # Never expose the SQLite DB or internal config files
    location ~* ^/daoanh/data/.*\.(db|sqlite|sqlite3|log|txt|bak|py|json)$ {
        deny all;
        return 403;
    }
    location = /daoanh/data/admin_emails.txt { deny all; return 403; }

    # ── Login / Auth routes → server.py (port 5001) ─────────────────────
    location ~ ^/(daoanh/)?api/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://daoanh_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin email management → server.py (internal use only — also protected by auth in server.py)
    location ~ ^/(daoanh/)?api/admin/emails {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://daoanh_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API routes → app.py (port 5000) ──────────────────────────────────
    location /daoanh/api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # CORS — allow reads from any origin; writes only from own origin
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|phatphaponline\.org)") {
            set $cors_origin $http_origin;
        }
        # For public read-only (GET) endpoints, allow * via app.py response headers
        # For OPTIONS preflight:
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        proxy_pass http://daoanh_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Static files ──────────────────────────────────────────────────────
    location /daoanh/static/ {
        alias /opt/phatphaponline_gradio/truyenthua/visjs-app/Dai_Tang_Kinh/daoanh/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Data files — only allow specific safe subdirectories, never raw DB
    location /daoanh/data/ttl/ {
        alias /opt/phatphaponline_gradio/truyenthua/visjs-app/Dai_Tang_Kinh/daoanh/data/ttl/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── Main app → app.py ─────────────────────────────────────────────────
    location /daoanh/ {
        proxy_pass http://daoanh_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Health check ──────────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Block common scanner/bot paths
    location ~* \.(php|asp|aspx|jsp|cgi|sh|bash)$ { return 444; }
    location ~* ^/(wp-admin|wp-login|phpmyadmin|admin\.php|xmlrpc) { return 444; }
}
