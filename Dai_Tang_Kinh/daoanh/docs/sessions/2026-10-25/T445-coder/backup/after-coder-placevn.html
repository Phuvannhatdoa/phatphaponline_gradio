const LucideIcon = ({ name, className, ...props }) => {
  const icon = ICON_SVGS[name];
  if (icon) {
    const [w, h, pathsArr] = icon;
    const paths = Array.isArray(pathsArr) ? pathsArr.join('') : (pathsArr || '');
    return <span dangerouslySetInnerHTML={{ __html: `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className || ''}">${paths}</svg>` }} />;
  }
  return <i className={className} {...props}></i>;
};

  'Xem preview 3.800 ID và chọn ID để sửa. Export CSV nếu cần.',

  'Tự động load 2.446 từ điển vào DB.',
  'Form table: Hán | Cũ | Mới, save inline. Cập nhật 7 rules.',
  'Real-time progress + log stream (polling) + error list.',
  'View grid + hierarchical filter + checkbox + Approve 100 rows.',
  'Real-time progress + log + error list (như B5).',
  'Stats + missing/duplicate list + 3 CSV downloads.'

// stepTitles/stepDescriptions already fold the "no B6" gap into their
// positional index (9 entries: B0,B1,B2,B3,B4,B5,B7,B8,B9), so the wizard
// position maps 1:1 onto that index — no separate skip-list needed.
const stepOrder = [0, 1, 2, 3, 4, 5, 6, 7, 8];

async function postJSON(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON response */ }
  if (!res.ok) {
    throw new Error((data && data.error) || `HTTP ${res.status}`);
  }
  return data;
}

// ── Step components (declared before use in stepComponents map below) ──

const BackupStep = ({ data, update, setMessage }) => {
  const [busy, setBusy] = useState(false);
  const run = async () => {
    setBusy(true);
    try {
      const resp = await postJSON('/backup', {});
      update({ backup_status: 'done', backup_path: resp.backup_path });
      setMessage({ type: 'success', text: resp.message || 'Backup xong' });
    } catch (e) {
      setMessage({ type: 'error', text: `Backup lỗi: ${e.message}` });
    } finally {
      setBusy(false);
    }
  };
  return (
    <div className="p-8">
      <h2 className="text-xl font-bold mb-6">T444 Wizard — {stepTitles[0]}</h2>
      <p className="text-slate-400 mb-4">{stepDescriptions[0]}</p>
      <div className="space-y-4">
        <button
          onClick={run}
          disabled={busy}
          className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 px-4 py-2 rounded text-[10px] font-black uppercase"
        >
          {busy ? 'Đang backup…' : 'Backup Database Now'}
        </button>
        {data.backup_status !== 'idle' && (
          <p className="text-sm text-emerald-400">{data.backup_status}: {data.backup_path || ''}</p>
        )}
      </div>
    </div>
  );
};

const BatchMonitorStep = ({ data, update, setMessage, bCode }) => {
  const [busy, setBusy] = useState(false);
  const start = async () => {
    setBusy(true);
    try {
      const resp = await postJSON('/batch-start', { step: bCode });
      update({ 
        batch_status: resp.status || 'running',
        batch_id: resp.batch_id,
        total: resp.total
      });
      setMessage({ type: 'success', text: `Batch started: ${resp.total} rows` });
    } catch (e) {
      setMessage({ type: 'error', text: `Lỗi start batch: ${e.message}` });
    } finally {
      setBusy(false);
    }
  };

  // Poll /daoanh/api/admin/batch-monitor every 2s while this step is active
  // and a batch is running (replaces the WebSocket in the original spec —
  // this app.py's Flask setup does not have WS support).
  useEffect(() => {
    if (data.batch_status !== 'running' || !data.batch_id) return undefined;
    let cancelled = false;
    const tick = async () => {
      try {
        const res = await fetch(`${API_BASE}/batch-monitor?batch_id=${data.batch_id}`);
        const json = await res.json();
        if (!cancelled) {
          update({
            progress: json.progress || 0,
            logs: json.logs || [],
            errors: json.errors || [],
            batch_status: json.status || data.batch_status,
            total: json.total || data.total,
            processed: json.processed || 0,
            stats: json.stats || { ok: 0, review: 0, error: 0 }
          });
        }
      } catch (e) { /* network hiccup, keep polling */ }
    };
    tick();
    const id = setInterval(tick, 2000);
    return () => { cancelled = true; clearInterval(id); };
  }, [data.batch_status, data.batch_id]);

  return (
    <div className="p-8">
      <h2 className="text-xl font-bold mb-6">T444 Wizard — {stepTitles[bCode === 'b5' ? 5 : 7]}</h2>
      <p className="text-slate-400 mb-4">{stepDescriptions[bCode === 'b5' ? 5 : 7]}</p>
      <div className="space-y-4">
        <p className="text-sm text-slate-500">Batch status: {data.batch_status || 'idle'}</p>
        <p className="text-sm text-slate-500">Progress: {data.progress || 0}% ({data.processed || 0}/{data.total || 0})</p>
        <div className="grid grid-cols-3 gap-2 text-xs">
          <div className="text-emerald-400">OK: {data.stats?.ok || 0}</div>
          <div className="text-amber-400">Review: {data.stats?.review || 0}</div>
          <div className="text-rose-400">Error: {data.stats?.error || 0}</div>
        </div>
        <button onClick={start} disabled={busy || data.batch_status === 'running'} className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 px-4 py-2 rounded">
          {data.batch_status === 'running' ? 'Đang chạy…' : 'Start Batch'}
        </button>
        <div className="space-y-1 max-h-40 overflow-y-auto custom-scrollbar">
          {(data.logs || []).map((log, i) => (
            <p key={i} className="text-[9px] text-slate-400">{log}</p>
          ))}
        </div>
        {(data.errors || []).length > 0 && (
          <div>
            <p className="text-sm text-red-400">Lỗi ({data.errors.length}):</p>
            {data.errors.slice(0, 5).map((err, i) => (
              <p key={i} className="text-[9px] text-red-300">{err}</p>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

      </div>
      <div className="mt-6 space-y-2">
        <p className="text-sm text-slate-500">Missing: {(data.missing || []).length}</p>
        <p className="text-sm text-slate-500">Duplicate: {(data.duplicate || []).length}</p>
        <div className="flex gap-2 mt-2">
          <button onClick={() => downloadCsv('missing')} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-[10px]">CSV Missing</button>
          <button onClick={() => downloadCsv('duplicate')} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-[10px]">CSV Duplicate</button>
          <button onClick={() => downloadCsv('full')} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-[10px]">CSV Full</button>
        </div>
      </div>
    </div>
  );
};

// Maps logical step index (see stepOrder) -> component + stepData key.
const stepComponents = {
  0: { Component: BackupStep, key: 'b0' },
  1: { Component: FixIdStep, key: 'b1' },
  2: { Component: SchemaStep, key: 'b2' },
  3: { Component: DictionaryStep, key: 'b3' },
  4: { Component: RulesStep, key: 'b4' },
  5: { Component: BatchMonitorStep, key: 'b5' },
  6: { Component: SampleStep, key: 'b7' },
  7: { Component: BatchMonitorStep, key: 'b8' },
  8: { Component: ReportStep, key: 'b9' }
};

const WIZARD_RESUME_KEY = 't445_wizard_step';

function App() {
  // ── wizard navigation state ──────────────────────────────────────
  const [wizardStep, setWizardStep] = useState(() => {
    try {
      const saved = parseInt(window.localStorage.getItem(WIZARD_RESUME_KEY) || '0', 10);
      return Number.isFinite(saved) && saved >= 0 && saved < stepOrder.length ? saved : 0;
    } catch (e) { return 0; }
  });

  useEffect(() => {
    try { window.localStorage.setItem(WIZARD_RESUME_KEY, String(wizardStep)); } catch (e) { /* ignore */ }
  }, [wizardStep]);

  // ── per-step data state ───────────────────────────────────────────
  const [stepData, setStepData] = useState({
    b0: { backup_status: 'idle', backup_path: null },
    b1: { count: 3800, selected_ids: [], csv_ready: false },
    b2: { schema_applied: false },
    b3: { dictionary_loaded: false, count: 0 },
    b4: { rules: [], editing_id: null, pending_save: false },
    b5: { batch_status: 'idle', progress: 0, logs: [], errors: [] },
    b7: { sample_data: [], categoryFilter: '', selected: [] },
    b8: { batch_status: 'idle', progress: 0, logs: [], errors: [] },
    b9: { stats: { ok: 0, review: 0, error: 0 }, missing: [], duplicate: [] }
  });

  const [message, setMessage] = useState(null);
  useEffect(() => {
    if (!message) return undefined;
    const t = setTimeout(() => setMessage(null), 4000);
    return () => clearTimeout(t);
  }, [message]);

  const activeCode = stepOrder[wizardStep];
  const entry = stepComponents[activeCode];

  if (!entry) {
    return <div className="p-8 text-center"><h2>Step {wizardStep + 1}/{stepOrder.length}</h2><p>Step chưa triển khai</p></div>;
  }

  const { Component: StepComponent, key: dataKey } = entry;
  const update = (patch) => setStepData(prev => ({ ...prev, [dataKey]: { ...prev[dataKey], ...patch } }));
  const extraProps = (dataKey === 'b5' || dataKey === 'b8') ? { bCode: dataKey } : {};

  return (
    <div className="min-h-screen flex flex-col">
      {/* Header */}
      <header className="sticky top-0 z-10 border-b border-slate-800/30 bg-[var(--card-dark)] p-6 flex items-center justify-between">
        <h1 className="text-2xl font-black text-white">T444 Gemini Places Wizard</h1>
        <div className="text-sm text-slate-500">
          Step {wizardStep + 1}/{stepOrder.length} — {stepTitles[activeCode]}
        </div>
      </header>

      {/* Toast */}
      {message && (
        <div className={`fixed top-20 right-6 z-20 px-4 py-2 rounded text-xs font-bold ${message.type === 'error' ? 'bg-rose-600' : message.type === 'info' ? 'bg-slate-700' : 'bg-emerald-600'}`}>
          {message.text}
        </div>
      )}

      {/* Wizard Content */}
      <main className="flex-1 overflow-y-auto custom-scrollbar">
        <StepComponent data={stepData[dataKey]} update={update} setMessage={setMessage} {...extraProps} />
      </main>

      {/* Footer Navigation */}
      <footer className="sticky bottom-0 border-t border-slate-800/30 bg-[var(--card-dark)] p-6 flex justify-between items-center">
        <button
          onClick={() => setWizardStep(s => Math.max(s - 1, 0))}
          disabled={wizardStep === 0}
          className="bg-slate-700 hover:bg-slate-600 disabled:opacity-40 px-4 py-2 rounded text-[10px] font-black uppercase transition-colors"
        >
          ← Back
        </button>
        <div className="text-xs text-slate-500">Step {wizardStep + 1}/{stepOrder.length}</div>
        <button
          onClick={() => setWizardStep(s => Math.min(s + 1, stepOrder.length - 1))}
          disabled={wizardStep === stepOrder.length - 1}
          className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 px-4 py-2 rounded text-[10px] font-black uppercase transition-colors"
        >
          Next →
        </button>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
